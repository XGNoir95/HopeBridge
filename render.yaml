services:
  - name: hopebridge-db
    type: pserv
    runtime: docker
    plan: free
    dockerfilePath: ./docker/mysql/Dockerfile
    envVars:
      - key: MYSQL_DATABASE
        value: hopebridgedb
      - key: MYSQL_ROOT_PASSWORD
        value: password
    disk:
      name: db-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  - name: hopebridge-app
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/php/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://hopebridge.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: hopebridge-db
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: hopebridgedb
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: password
      - key: CLOUDINARY_URL
        value: cloudinary://366673975893178:atCasDRMLxzLa9AKPQ9J8eLCIog@dubi9peal

  - name: hopebridge-frontend
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/node/Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hopebridge.onrender.com/api
