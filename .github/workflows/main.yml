name: test_project

on:
  pull_request:
    branches:
      - developer

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        tools: composer:v2

    - name: Install Composer dependencies
      working-directory: backend
      run: |
        composer install --no-interaction --prefer-dist --no-progress

    - name: Ensure .env file exists
      working-directory: backend
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env || echo "APP_KEY=$(php artisan key:generate --show)" > .env
        fi

    - name: Ensure phpunit.xml exists
      working-directory: backend
      run: |
        if [ ! -f phpunit.xml ]; then
          cp phpunit.xml.dist phpunit.xml
        fi

    - name: Ensure tests/TestCase.php exists
      working-directory: backend/tests
      run: |
        mkdir -p tests
        if [ ! -f TestCase.php ]; then
          echo "<?php
          namespace Tests;
          use Illuminate\Foundation\Testing\TestCase as BaseTestCase;
          abstract class TestCase extends BaseTestCase
          { use CreatesApplication; }" > TestCase.php
        fi

    - name: Ensure tests/CreatesApplication.php exists
      working-directory: backend/tests
      run: |
        if [ ! -f CreatesApplication.php ]; then
          echo "<?php
          namespace Tests;
          use Illuminate\Contracts\Console\Kernel;
          trait CreatesApplication
          {
              public function createApplication()
              {
                  \$app = require __DIR__.'/../bootstrap/app.php';
                  \$app->make(Kernel::class)->bootstrap();
                  return \$app;
              }
          }" > CreatesApplication.php
        fi

    - name: Set up database
      working-directory: backend
      run: php artisan migrate --force

    - name: Seed database
      working-directory: backend
      run: php artisan db:seed --force

    - name: Run tests
      working-directory: backend
      run: php artisan test --no-tty

    - name: Run code quality checks
      working-directory: backend
      run: |
        composer run-script phpcs
        composer run-script phpmd
