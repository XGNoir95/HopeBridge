version: '3.8'

services:
  # PHP/Laravel Backend
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: hopebridge-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - trendy-network
    depends_on:
      - db

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: hopebridge-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - trendy-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: hopebridge-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hopebridgedb
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - trendy-mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - trendy-network
    ports:
      - "3306:3306"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hopebridge-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    networks:
      - trendy-network
    depends_on:
      - db

  # Node.js/React Frontend
  frontend:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: hopebridge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - trendy-network

networks:
  trendy-network:
    driver: bridge

volumes:
  trendy-mysql-data:
    driver: local
